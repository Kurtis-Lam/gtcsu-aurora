  /* ---------- Info dropdown: animated reveal ---------- */
  .nav-dropdown { position:relative; --dd-ease:cubic-bezier(0.16,1,0.3,1); --dd-spring:cubic-bezier(0.34,1.56,0.64,1); }
  .nav-dropdown-toggle { display:inline-flex; align-items:center; gap:8px; font-family:inherit; cursor:pointer; background:transparent; white-space:nowrap; }
  .nav-caret { flex:none; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:translateY(-2px) rotate(45deg); transition:transform .5s var(--dd-spring); }
  .nav-dropdown.open .nav-caret { transform:translateY(2px) rotate(225deg); }

  .nav-dropdown-menu {
    position:absolute; z-index:110; top:calc(100% + 8px); left:0; min-width:190px; padding:8px;
    display:flex; flex-direction:column; gap:4px;
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(46,230,184,0.16), transparent 60%),
      radial-gradient(100% 90% at 100% 100%, rgba(167,139,250,0.13), transparent 62%),
      linear-gradient(160deg, rgba(14,36,44,0.97), rgba(10,26,32,0.97));

    box-shadow:0 8px 20px rgba(0,0,0,0.3), 0 0 0 rgba(46,230,184,0);
    transform-origin:32px -8px;
    opacity:0; visibility:hidden; pointer-events:none;
    transform:perspective(700px) translateY(-14px) scale(0.88) rotateX(-16deg);
    filter:blur(6px);
    transition:opacity .18s ease, transform .22s ease, filter .18s ease, box-shadow .2s ease, visibility 0s linear .22s;
  }
  .nav-dropdown-menu::before { content:''; position:absolute; left:0; right:0; top:-10px; height:10px; }
  .nav-dropdown-menu::after {
    content:''; position:absolute; left:16px; right:16px; top:-1px; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, #2fe6b8, #7fe9f0, #a78bfa, #2fe6b8, transparent);
    background-size:200% 100%; transform:scaleX(0); transform-origin:left center; opacity:0;
    transition:transform .2s ease, opacity .2s ease;
  }

  .nav-dropdown-menu .nav-btn,
  .nav-dropdown-menu .nav-btn.active {
    position:relative; isolation:isolate; overflow:hidden; display:block; width:100%; border-radius:10px; text-align:left;
    transform:none;
    transition:color .25s ease, background .25s ease, border-color .25s ease, box-shadow .25s ease, transform .35s var(--dd-ease);
  }
  .nav-dropdown-menu .nav-btn::before {
    content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(100deg, transparent 15%, rgba(127,233,240,0.28) 50%, transparent 85%);
    transform:translateX(-110%); transition:transform .7s var(--dd-ease);
  }
  .nav-dropdown-menu .nav-btn::after {
    content:''; position:absolute; left:6px; top:50%; width:3px; height:0; border-radius:3px; transform:translateY(-50%);
    background:linear-gradient(180deg, #7fe9f0, #2fe6b8); box-shadow:0 0 8px rgba(46,230,184,0.7);
    transition:height .35s var(--dd-spring);
  }
  .nav-dropdown-menu .nav-btn:hover { transform:translateX(4px); }
  .nav-dropdown-menu .nav-btn:hover::before { transform:translateX(110%); }
  .nav-dropdown-menu .nav-btn:hover::after,
  .nav-dropdown-menu .nav-btn.active::after { height:55%; }
  .nav-dropdown-menu .nav-btn:nth-child(1) { --dd-delay:0.08s; }
  .nav-dropdown-menu .nav-btn:nth-child(2) { --dd-delay:0.14s; }
  .nav-dropdown-menu .nav-btn:nth-child(3) { --dd-delay:0.20s; }
  .nav-dropdown-menu .nav-btn:nth-child(4) { --dd-delay:0.26s; }

  .nav-dropdown.open .nav-dropdown-menu .nav-btn { animation:dd-item-in .6s var(--dd-ease) var(--dd-delay, 0s) backwards; }
  .nav-dropdown.open .nav-dropdown-menu::after { transform:scaleX(1); opacity:1; transition:transform .7s var(--dd-ease) .12s, opacity .3s ease .12s; animation:dd-aurora 5s linear .8s infinite; }

  @keyframes dd-item-in {
    from { opacity:0; transform:translateX(-18px) scale(0.94); filter:blur(4px); }
    60%  { filter:blur(0); }
    to   { opacity:1; transform:none; filter:none; }
  }
  @keyframes dd-aurora {
    from { background-position:0% 50%; }
    to   { background-position:200% 50%; }
  }

  @media (min-width: 769px) {
    .nav-dropdown:hover .nav-caret, .nav-dropdown:focus-within .nav-caret { transform:translateY(2px) rotate(225deg); }
    .nav-dropdown:hover .nav-dropdown-menu, .nav-dropdown:focus-within .nav-dropdown-menu, .nav-dropdown.open .nav-dropdown-menu {
      opacity:1; visibility:visible; pointer-events:auto;
      transform:perspective(700px) translateY(0) scale(1) rotateX(0deg); filter:none;

</style>
