<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora - Photo Gallery</title>
<link rel="icon" type="image/jpeg" href="assets/aurora-logo.png">

<script type="module" src="js/analytics.js"></script>

<!-- Asset & Component Preloading --> 
<link rel="preload" href="panel.html" as="fetch" crossorigin>
<link rel="preload" href="assets/aurora-logo.png" as="image">
<link rel="preload" href="https://res.cloudinary.com/dl2xijhcd/video/upload/f_auto,q_auto,w_1280/v1790563703/background.mp4" as="video" type="video/mp4" crossorigin>

<script type="module" src="js/load-components.js"></script>

<!-- JSZip & FileSaver for multi-select zip downloads -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #050b12;
    --deep: #0a1a20;
    --ink: #dff6f2;
    --aurora-teal: #2fe6b8;
    --aurora-green: #6ee89a;
    --aurora-cyan: #7fe9f0;
    --aurora-violet: #8f8cf0;
    --glass-bg: rgba(10, 26, 32, 0.65);
    --glass-border: rgba(127, 233, 240, 0.2);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    min-height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
  }

  /* Preloader */
  #preloader {
    position: fixed; inset: 0; z-index: 9999;
    background: #000000;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  body.is-loaded #preloader { opacity: 0; visibility: hidden; }

  /* Top Navigation Panel */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 4vw;
    background: rgba(6, 13, 22, 0.65);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(223, 246, 242, 0.12);
  }
  .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(127, 233, 240, 0.4); box-shadow: 0 0 12px rgba(46, 230, 184, 0.25); }
  .nav-title { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.15rem; color: #eafffb; letter-spacing: 0.05em; }
  .nav-links { display: flex; align-items: center; gap: 1rem; }
  .nav-btn {
    color: rgba(223, 246, 242, 0.85); text-decoration: none; font-size: 0.9rem; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; border: 1px solid transparent; transition: all 0.3s ease;
  }
  .nav-btn:hover, .nav-btn.active {
    color: #ffffff; border-color: rgba(127, 233, 240, 0.4); background: rgba(127, 233, 240, 0.1);
    box-shadow: 0 0 12px rgba(127, 233, 240, 0.2);
  }

  /* Hamburger Button */
  .hamburger-btn {
    display: none; background: transparent; border: none; cursor: pointer;
    flex-direction: column; justify-content: space-between; width: 24px; height: 18px; padding: 0; z-index: 102;
  }
  .hamburger-btn span {
    display: block; width: 100%; height: 2px; background-color: var(--ink); border-radius: 2px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  }
  .hamburger-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .hamburger-btn.open span:nth-child(2) { opacity: 0; }
  .hamburger-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* Mobile Nav Overlay */
  .nav-overlay {
    position: fixed; inset: 0; background: rgba(5, 11, 18, 0.7); backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px); z-index: 98; opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .nav-overlay.active { opacity: 1; visibility: visible; }

  /* Background Video */
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--void); }
  .bg-video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; transform: translate(-50%, -50%); object-fit: cover; }
  .sky-overlay { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(5, 11, 18, 0.3) 0%, rgba(5, 11, 18, 0.75) 100%); pointer-events: none; }

  /* Layout Container */
  .page-container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 140px 4vw 80px; }
  .header-section { text-align: center; margin-bottom: 40px; }
  .page-subtitle { font-size: 0.85rem; letter-spacing: 0.2em; color: var(--aurora-cyan); text-transform: uppercase; margin-bottom: 12px; }
  .page-title { font-family: 'Cinzel', serif; font-size: clamp(2.2rem, 5vw, 3.8rem); color: #ffffff; margin-bottom: 16px; }
  .page-desc { max-width: 600px; margin: 0 auto; font-size: 1rem; color: rgba(223, 246, 242, 0.75); line-height: 1.6; }

  /* Google Sign-In Auth Card */
  .auth-card {
    max-width: 480px;
    margin: 40px auto;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .auth-icon { font-size: 2.8rem; margin-bottom: 16px; }
  .auth-title { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #ffffff; margin-bottom: 12px; }
  .auth-desc { font-size: 0.95rem; color: rgba(223, 246, 242, 0.8); line-height: 1.6; margin-bottom: 28px; }
  .auth-desc strong { color: var(--aurora-cyan); }
  
  .google-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    background: #ffffff; color: #202124; border: none;
    padding: 12px 28px; border-radius: 999px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .google-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(46, 230, 184, 0.4);
    background: #f8f9fa;
  }
  .google-icon { flex-shrink: 0; }

  /* Category Filter Tabs */
  .filter-bar {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px;
  }
  .filter-btn {
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    color: var(--ink); padding: 8px 18px; border-radius: 999px; font-size: 0.85rem;
    font-weight: 500; cursor: pointer; transition: all 0.3s ease;
    backdrop-filter: blur(8px);
  }
  .filter-btn:hover, .filter-btn.active {
    background: rgba(46, 230, 184, 0.2); border-color: var(--aurora-teal); color: #ffffff;
    box-shadow: 0 0 12px rgba(46, 230, 184, 0.3);
  }

  /* Batch Download Toolbar */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 12px 20px; margin-bottom: 24px;
    backdrop-filter: blur(12px);
  }
  .toolbar-info { font-size: 0.88rem; color: var(--aurora-cyan); }
  .download-btn {
    background: var(--aurora-teal); color: #050b12; border: none;
    padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;
  }
  .download-btn:hover:not(:disabled) { box-shadow: 0 0 12px rgba(46, 230, 184, 0.5); opacity: 0.95; }
  .download-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Photos Masonry Grid */
  .photos-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
  }
  .photo-card {
    position: relative; border-radius: 12px; overflow: hidden;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    aspect-ratio: 4 / 3; cursor: pointer; transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .photo-card:hover { transform: translateY(-4px); border-color: var(--aurora-cyan); }
  .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .photo-card:hover img { transform: scale(1.05); }

  .photo-select-checkbox {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    width: 20px; height: 20px; accent-color: var(--aurora-teal); cursor: pointer;
  }

  .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(5, 11, 18, 0.85) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.3s ease; display: flex; flex-direction: column;
    justify-content: flex-end; padding: 14px;
  }
  .photo-card:hover .photo-overlay { opacity: 1; }
  .photo-title { font-size: 0.95rem; font-weight: 600; color: #ffffff; }
  .photo-folder { font-size: 0.75rem; color: var(--aurora-cyan); }

  /* Lightbox Modal */
  .lightbox-modal {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(5, 11, 18, 0.92); backdrop-filter: blur(12px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
  }
  .lightbox-modal.active { opacity: 1; visibility: visible; }
  .lightbox-content {
    max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; align-items: center;
  }
  .lightbox-img { max-width: 100%; max-height: 75vh; border-radius: 8px; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
  .lightbox-title { margin-top: 14px; font-size: 1.1rem; color: #ffffff; text-align: center; }
  .lightbox-close {
    position: absolute; top: 24px; right: 28px; background: transparent; border: none;
    color: #ffffff; font-size: 2rem; cursor: pointer; transition: color 0.2s ease;
  }
  .lightbox-close:hover { color: var(--aurora-teal); }

  /* Mobile Responsive Media Query */
  @media (max-width: 768px) {
    .hamburger-btn { display: flex; }
    .navbar { justify-content: flex-start; gap: 16px; padding: 0.8rem 1rem; }
    .nav-title { display: inline-block; }
    .nav-links {
      position: fixed; top: 0; left: 0; width: 260px; height: 100vh; height: 100dvh;
      background: rgba(10, 26, 32, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(127, 233, 240, 0.25); box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      flex-direction: column; align-items: flex-start; padding: 80px 20px 24px; gap: 0.8rem;
      transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); z-index: 99;
    }
    .nav-links.active { transform: translateX(0); }
    .nav-btn { width: 100%; text-align: left; padding: 10px 16px; font-size: 0.95rem; }
  }
  /* ---------- Language toggle + switch transition (same as activities.html) ---------- */
  .navbar, .page-container, .lang-toggle {
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.35s ease-in, transform 0.35s ease-in; pointer-events: none;
  }
  body.is-loaded .navbar,
  body.is-loaded .page-container,
  body.is-loaded .lang-toggle {
    opacity: 1; transform: translateY(0); pointer-events: auto;
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  body.is-loaded .navbar { transition-delay: 0.15s; }
  body.is-loaded .page-container { transition-delay: 0.35s; }
  body.is-loaded .lang-toggle { transition-delay: 0.55s; }

  .lang-toggle {
    position: fixed; bottom: 24px; right: 24px; z-index: 1000;
    display: flex; align-items: center; gap: 8px; padding: 10px 18px;
    border-radius: 999px; border: 1px solid rgba(127, 233, 240, 0.35);
    background: rgba(10, 26, 32, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #eafffb; font-size: 0.85rem; font-weight: 500; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  body.is-loaded .lang-toggle:hover {
    border-color: rgba(127, 233, 240, 0.8); background: rgba(18, 42, 50, 0.85);
    box-shadow: 0 0 16px rgba(46, 230, 184, 0.3); transform: translateY(-2px);
  }
  @media (max-width: 768px) {
    .lang-toggle { bottom: 16px; right: 16px; padding: 8px 14px; font-size: 0.8rem; }
  }
</style>
</head>

<body class="is-loaded">
  <div id="preloader"></div>


  <!-- Dynamic Navigation Panel Mount Point -->
  <div id="panel-container"></div>

  <!-- Video Background Container -->
  <div id="background-container"></div>

  <!-- Content -->
  <div class="page-container">
    <div class="header-section">
      <p class="page-subtitle i18n" data-en="Visual Experience" data-zh="視覺體驗">Visual Experience</p>
      <h1 class="page-title i18n" data-en="Photo Gallery" data-zh="相片庫">Photo Gallery</h1>
      <p class="page-desc i18n" data-en="Browse high-resolution captures from our events and activities." data-zh="瀏覽我們活動與盛事的高清相片。">Browse high-resolution captures from our events and activities.</p>
    </div>

    <!-- Sign In Prompt (Shown when not authenticated with @gtcollege.edu.hk) -->
    <div id="auth-container" class="auth-card" style="display: none;">
      <div class="auth-icon">🔒</div>
      <h2 class="auth-title i18n" data-en="School Access Required" data-zh="需要學校帳戶登入">School Access Required</h2>
      <p class="auth-desc i18n" data-en="Please sign in with your official <strong>@gtcollege.edu.hk</strong> email address to view the photo gallery." data-zh="請使用學校官方 <strong>@gtcollege.edu.hk</strong> 電郵地址登入以瀏覽相片庫。">Please sign in with your official <strong>@gtcollege.edu.hk</strong> email address to view the photo gallery.</p>
      <button id="google-signin-btn" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span class="i18n" data-en="Sign in with Google" data-zh="使用 Google 登入">Sign in with Google</span>
      </button>
    </div>

    <!-- Gallery Content (Shown after successful authentication) -->
    <div id="gallery-content" style="display: none;">
      <!-- Category Filter Bar -->
      <div class="filter-bar" id="folder-filters">
        <button class="filter-btn active" data-folder-id="all">✨ All Photos</button>
      </div>

      <!-- Toolbar for Multi-select Downloads -->
      <div class="toolbar">
        <span class="toolbar-info" id="selected-count">0 photos selected</span>
        <button class="download-btn" id="download-zip-btn" disabled>
          📥 Download Selected (ZIP)
        </button>
      </div>

      <!-- Gallery Grid -->
      <div class="photos-grid" id="photos-grid">
        <p style="grid-column: 1/-1; text-align: center; color: rgba(223,246,242,0.5); padding: 40px;">
          Loading photos gallery...
        </p>
      </div>
    </div>
  </div>

  <!-- Lightbox Popup -->
  <div class="lightbox-modal" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="" class="lightbox-img">
      <div id="lightbox-title" class="lightbox-title"></div>
    </div>
  </div>

  <script type="module">
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { db } from './js/firebase-config.js';
    import { AuroraAuth } from './js/load-components.js';
    import { API_BASE } from './js/api-config.js';

    const authContainer = document.getElementById('auth-container');
    const galleryContent = document.getElementById('gallery-content');
    const gridEl = document.getElementById('photos-grid');
    const filtersEl = document.getElementById('folder-filters');
    const countEl = document.getElementById('selected-count');
    const downloadBtn = document.getElementById('download-zip-btn');

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxTitle = document.getElementById('lightbox-title');

    let currentLang = localStorage.getItem('aurora_lang') || 'en';
    let zipping = false;
    let lastMessage = null; // { key, isError } so status text can be re-translated

    const T = {
      en: {
        allPhotos: '✨ All Photos',
        selected: (n) => `${n} photo(s) selected`,
        download: '📥 Download Selected (ZIP)',
        zipping: '⏳ Zipping...',
        loading: 'Loading photos gallery...',
        loadFail: 'Failed to load photos. Please refresh and try again.',
        empty: 'No photos available in this folder.',
        untitled: 'Untitled',
        gallery: 'Gallery',
        photo: 'Photo',
        zipFail: (m) => 'Failed to download ZIP: ' + m
      },
      zh: {
        allPhotos: '✨ 全部相片',
        selected: (n) => `已選擇 ${n} 張相片`,
        download: '📥 下載所選相片 (ZIP)',
        zipping: '⏳ 正在壓縮...',
        loading: '正在載入相片庫...',
        loadFail: '載入相片失敗，請重新整理後再試。',
        empty: '此資料夾暫無相片。',
        untitled: '無標題',
        gallery: '相片庫',
        photo: '相片',
        zipFail: (m) => '下載 ZIP 失敗：' + m
      }
    };
    const t = () => T[currentLang];

    let allImages = [];
    let allFolders = [];
    let activeFolderId = 'all';
    let galleryLoaded = false;
    const selectedImageIds = new Set();

    const escapeHtml = (str) => String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

    // ---- Access: school accounts only (also enforced by Firestore rules + /api/photo-urls) ----
    document.getElementById('google-signin-btn').addEventListener('click', () => AuroraAuth.signIn());

    AuroraAuth.onChange((user) => {
      if (user) {
        authContainer.style.display = 'none';
        galleryContent.style.display = 'block';
        if (!galleryLoaded) initGallery();
      } else {
        galleryContent.style.display = 'none';
        authContainer.style.display = 'block';
        // Drop everything that was loaded for the previous user.
        galleryLoaded = false;
        allImages = [];
        allFolders = [];
        selectedImageIds.clear();
        lightbox.classList.remove('active');
      }
    });

    function showMessage(key, isError) {
      lastMessage = { key, isError };
      const text = t()[key];
      gridEl.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:${isError ? '#ff6b6b' : 'rgba(223,246,242,0.5)'}; padding:40px;">${escapeHtml(text)}</p>`;
    }

    // Gallery files are private on Cloudinary: ask the server for signed URLs.
    async function fetchSignedUrls(publicIds) {
      const token = await AuroraAuth.getIdToken();
      const urls = {};
      for (let i = 0; i < publicIds.length; i += 200) {
        const res = await fetch(`${API_BASE}/api/photo-urls`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ publicIds: publicIds.slice(i, i + 200) })
        });
        if (!res.ok) throw new Error(`Could not load photo links (${res.status})`);
        Object.assign(urls, (await res.json()).urls);
      }
      return urls;
    }

    async function initGallery() {
      galleryLoaded = true;
      showMessage('loading', false);
      try {
        const [imagesSnap, foldersSnap] = await Promise.all([
          getDocs(collection(db, "galleryImages")),
          getDocs(collection(db, "galleryFolders"))
        ]);

        const images = imagesSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(img => img.publicId);
        const urls = await fetchSignedUrls(images.map(img => img.publicId));

        allImages = images
          .filter(img => urls[img.publicId])
          .map(img => ({ ...img, urls: urls[img.publicId] }));
        allFolders = foldersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        renderFilters();
        renderGallery();
      } catch (err) {
        console.error("Failed to load gallery:", err);
        galleryLoaded = false;
        showMessage('loadFail', true);
      }
    }

    function renderFilters() {
      let html = `<button class="filter-btn ${activeFolderId === 'all' ? 'active' : ''}" data-folder-id="all">${t().allPhotos}</button>`;
      allFolders.forEach(folder => {
        html += `<button class="filter-btn ${activeFolderId === folder.id ? 'active' : ''}" data-folder-id="${escapeHtml(folder.id)}">📁 ${escapeHtml(folder.name)}</button>`;
      });
      filtersEl.innerHTML = html;

      filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFolderId = btn.getAttribute('data-folder-id');
          filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderGallery();
        });
      });
    }

    function renderGallery() {
      const filtered = activeFolderId === 'all'
        ? allImages
        : allImages.filter(img => img.folderId === activeFolderId);

      if (filtered.length === 0) {
        showMessage('empty', false);
        return;
      }

      gridEl.innerHTML = filtered.map(img => `
        <div class="photo-card" data-img-id="${escapeHtml(img.id)}">
          <input type="checkbox" class="photo-select-checkbox" data-id="${escapeHtml(img.id)}" ${selectedImageIds.has(img.id) ? 'checked' : ''}>
          <img src="${escapeHtml(img.urls.thumb)}" alt="${escapeHtml(img.title || img.name || t().photo)}" loading="lazy">
          <div class="photo-overlay">
            <span class="photo-title">${escapeHtml(img.title || img.name || t().untitled)}</span>
            <span class="photo-folder">${escapeHtml(img.folderPath || t().gallery)}</span>
          </div>
        </div>
      `).join('');

      gridEl.querySelectorAll('.photo-select-checkbox').forEach(cb => {
        cb.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = cb.getAttribute('data-id');
          if (cb.checked) selectedImageIds.add(id); else selectedImageIds.delete(id);
          updateToolbar();
        });
      });

      gridEl.querySelectorAll('.photo-card').forEach(card => {
        card.addEventListener('click', () => {
          const img = allImages.find(x => x.id === card.getAttribute('data-img-id'));
          if (img) openLightbox(img);
        });
      });
    }

    function updateToolbar() {
      countEl.textContent = t().selected(selectedImageIds.size);
      if (!zipping) {
        downloadBtn.textContent = t().download;
        downloadBtn.disabled = selectedImageIds.size === 0;
      }
    }

    function openLightbox(img) {
      lightboxImg.src = img.urls.view;
      lightboxTitle.textContent = img.title || img.name || '';
      lightbox.classList.add('active');
    }

    const closeLightbox = () => lightbox.classList.remove('active');
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

    downloadBtn.addEventListener('click', async () => {
      if (selectedImageIds.size === 0) return;
      zipping = true;
      downloadBtn.disabled = true;
      downloadBtn.textContent = t().zipping;

      const zip = new JSZip();
      const selected = allImages.filter(img => selectedImageIds.has(img.id));

      try {
        for (let i = 0; i < selected.length; i++) {
          const img = selected[i];
          const response = await fetch(img.urls.original);
          if (!response.ok) throw new Error(`Could not fetch ${img.name || 'photo'} (${response.status})`);
          // Index prefix keeps identically named files from overwriting each other.
          zip.file(`${String(i + 1).padStart(3, '0')}-${img.name || 'photo.jpg'}`, await response.blob());
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = 'aurora-photos.zip';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      } catch (err) {
        alert(t().zipFail(err.message));
      } finally {
        zipping = false;
        updateToolbar();
      }
    });

    // ---- Language (same mechanism as activities.html) ----
    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('aurora_lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';

      document.querySelectorAll('.i18n').forEach(el => {
        const text = el.getAttribute(`data-${lang}`);
        if (text) el.innerHTML = text;
      });

      const langText = document.getElementById('lang-text');
      if (langText) langText.textContent = lang === 'en' ? '繁體中文' : 'English';

      // Re-render the dynamic parts
      updateToolbar();
      if (allImages.length) {
        renderFilters();
        renderGallery();
      } else {
        filtersEl.innerHTML = `<button class="filter-btn active" data-folder-id="all">${t().allPhotos}</button>`;
        if (lastMessage) showMessage(lastMessage.key, lastMessage.isError);
      }
    }

    window.setLanguage = setLanguage; // used by the shared language button
    setLanguage(currentLang);
  </script>
</body>
</html>
