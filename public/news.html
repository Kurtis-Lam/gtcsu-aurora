<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora - Latest News</title>
  <link rel="icon" type="image/png" href="assets/aurora-logo.png">
  <link rel="preload" href="assets/aurora-logo.png" as="image">
  <link rel="preload" href="https://res.cloudinary.com/dl2xijhcd/video/upload/f_auto,q_auto,w_1280/v1790563703/background.mp4" as="video" type="video/mp4" crossorigin>
  <script type="module" src="js/analytics.js"></script>
  <script type="module" src="js/load-components.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --void:#050b12; --ink:#dff6f2; --cyan:#7fe9f0; --teal:#2fe6b8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--void); color:var(--ink); font-family:Manrope,sans-serif; }
    #background-container { position:fixed; inset:0; z-index:0; pointer-events:none; }
    main { position:relative; z-index:1; width:min(900px, 92vw); margin:0 auto; padding:145px 0 80px; }
    header { text-align:center; margin-bottom:34px; }
    h1 { margin:0 0 12px; color:white; font:600 clamp(2rem,5vw,3.5rem) Cinzel,serif; }
    .subtitle { color:var(--cyan); letter-spacing:.16em; text-transform:uppercase; font-size:.82rem; }
    .news-list { display:grid; gap:18px; }
    .news-card,.notice { padding:24px; border:1px solid rgba(127,233,240,.24); border-radius:16px; background:rgba(10,26,32,.82); backdrop-filter:blur(10px); }
    .news-card h2 { color:var(--teal); margin:0 0 12px; font:600 1.4rem Cinzel,serif; }
    .news-card p { white-space:pre-wrap; line-height:1.75; margin:0 0 18px; }
    .news-meta { font-size:.78rem; color:rgba(223,246,242,.58); margin-bottom:14px; }
    .read-btn { border:1px solid rgba(127,233,240,.42); border-radius:999px; background:rgba(47,230,184,.12); color:white; padding:9px 16px; font:inherit; cursor:pointer; }
    .read-btn:disabled { opacity:.65; cursor:default; }
    .notice { text-align:center; color:rgba(223,246,242,.78); }
    @media (max-width:600px) { .news-card,.notice { padding:18px; } }

    html { background:var(--void); overflow-x:hidden; }
    body { overflow-x:hidden; }

    /* ---------- Preloader + bottom-to-top reveal (same as aboutus.html) ---------- */
    #preloader { position:fixed; inset:0; z-index:9999; background:#000; transition:opacity .8s ease, visibility .8s ease; }
    body.is-loaded #preloader { opacity:0; visibility:hidden; }

    .navbar, main > header, #news-content.notice, .lang-toggle {
      opacity:0; transform:translateY(16px);
      transition:opacity .35s ease-in, transform .35s ease-in; pointer-events:none;
    }
    body.is-loaded .navbar,
    body.is-loaded main > header,
    body.is-loaded #news-content.notice,
    body.is-loaded .lang-toggle {
      opacity:1; transform:translateY(0); pointer-events:auto;
      transition:opacity 1.2s cubic-bezier(.16,1,.3,1), transform 1.2s cubic-bezier(.16,1,.3,1);
    }
    body.is-loaded .navbar { transition-delay:.15s; }
    body.is-loaded main > header, body.is-loaded #news-content.notice { transition-delay:.35s; }
    body.is-loaded .lang-toggle { transition-delay:.55s; }

    .fade-in { opacity:0; transform:translateY(20px); transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); will-change:opacity, transform; }
    .fade-in.is-visible { opacity:1; transform:translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .navbar, main > header, #news-content.notice, .fade-in, .lang-toggle { transition:none !important; opacity:1 !important; transform:none !important; }
    }

    /* ---------- Navbar (copied from index.html) ---------- */
    .navbar { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1rem 4vw; background:rgba(6,13,22,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid rgba(223,246,242,.12); }
    .nav-brand { display:flex; align-items:center; gap:12px; text-decoration:none; }
    .nav-logo { width:40px; height:40px; border-radius:50%; object-fit:cover; border:1px solid rgba(127,233,240,.4); box-shadow:0 0 12px rgba(46,230,184,.25); }
    .nav-title { font-family:'Cinzel',serif; font-weight:600; font-size:1.15rem; color:#eafffb; letter-spacing:.05em; }
    .nav-links { display:flex; align-items:center; gap:1.2rem; }
    .nav-btn { color:rgba(223,246,242,.85); text-decoration:none; font-size:.9rem; font-weight:500; letter-spacing:.03em; padding:8px 16px; border-radius:999px; border:1px solid transparent; transition:all .3s ease; cursor:pointer; background:transparent; }
    .nav-btn:hover, .nav-btn.active { color:#fff; border-color:rgba(127,233,240,.4); background:rgba(127,233,240,.1); box-shadow:0 0 12px rgba(127,233,240,.2); transform:translateY(-1px); }

    .hamburger-btn { display:none; background:transparent; border:none; cursor:pointer; flex-direction:column; justify-content:space-between; width:24px; height:18px; padding:0; z-index:102; }
    .hamburger-btn span { display:block; width:100%; height:2px; background-color:var(--ink); border-radius:2px; transition:transform .3s cubic-bezier(.16,1,.3,1), opacity .3s ease; }
    .hamburger-btn.open span:nth-child(1) { transform:translateY(8px) rotate(45deg); }
    .hamburger-btn.open span:nth-child(2) { opacity:0; }
    .hamburger-btn.open span:nth-child(3) { transform:translateY(-8px) rotate(-45deg); }

    .nav-overlay { position:fixed; inset:0; background:rgba(5,11,18,.7); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:98; opacity:0; visibility:hidden; transition:opacity .35s ease, visibility .35s ease; }
    .nav-overlay.active { opacity:1; visibility:visible; }

    /* ---------- Video background (copied from index.html) ---------- */
    .sky { position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--void); transform:translateZ(0); }
    .bg-video { position:absolute; top:50%; left:50%; min-width:100%; min-height:100%; width:auto; height:auto; transform:translate(-50%,-50%) translateZ(0); will-change:transform; object-fit:cover; backface-visibility:hidden; }
    .sky-overlay { position:absolute; inset:0; background:radial-gradient(circle at center, rgba(5,11,18,.2) 0%, rgba(5,11,18,.6) 100%), linear-gradient(180deg, rgba(5,11,18,.3) 0%, rgba(5,11,18,.7) 100%); pointer-events:none; }

    @media (max-width:768px) {
      .hamburger-btn { display:flex; }
      .navbar { justify-content:flex-start; gap:16px; padding:.8rem 1rem; }
      .nav-links { position:fixed; top:0; left:0; width:260px; height:100vh; height:100dvh; background:rgba(10,26,32,.95); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-right:1px solid rgba(127,233,240,.25); box-shadow:4px 0 24px rgba(0,0,0,.5); flex-direction:column; align-items:flex-start; padding:80px 20px 24px; gap:.8rem; transform:translateX(-100%); transition:transform .35s cubic-bezier(.16,1,.3,1); z-index:99; }
      .nav-links.active { transform:translateX(0); }
      .nav-btn { width:100%; text-align:left; padding:10px 16px; font-size:.95rem; }
      .lang-toggle { bottom:16px; right:16px; padding:8px 14px; font-size:.8rem; }
    }
  </style>
</head>
<body>
  <div id="preloader"></div>
  <div id="panel-container"></div>
  <div id="background-container"></div>
  <main>
    <header>
      <p class="subtitle i18n" data-en="Aurora announcements" data-zh="Aurora 最新公告">Aurora announcements</p>
      <h1 class="i18n" data-en="Latest News" data-zh="最新消息">Latest News</h1>
    </header>
    <section id="news-content" class="notice i18n" data-en="Loading news…" data-zh="正在載入消息……">Loading news…</section>
  </main>
  <script type="module">
    import { collection, doc, onSnapshot, query, serverTimestamp, setDoc, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { AuroraAuth } from './js/load-components.js';
    import { db } from './js/firebase-config.js';

    const content = document.getElementById('news-content');
    const lang = () => localStorage.getItem('aurora_lang') === 'zh' ? 'zh' : 'en';
    let activeUser = null;
    let articles = null;
    let readReceipts = new Map();
    let newsUnsubscribers = [];
    const revealedIds = new Set();
    const text = {
      en: { loading:'Loading news…', empty:'There are no announcements yet.', fail:'Could not load news. Please refresh and try again.', mark:'Mark as read', read:'Read', markFailed:'Could not mark as read. Try again.', date:'Published' },
      zh: { loading:'正在載入消息……', empty:'暫時沒有公告。', fail:'無法載入消息，請重新整理再試。', mark:'標記為已讀', read:'已讀', markFailed:'無法標記為已讀，請再試一次。', date:'發布時間' }
    };
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const millis = value => value?.toMillis?.() || 0;
    const updateLanguage = language => {
      document.documentElement.lang = language === 'zh' ? 'zh-Hant' : 'en';
      document.querySelectorAll('.i18n').forEach(el => {
        const translated = el.getAttribute(`data-${language}`);
        if (translated) el.textContent = translated;
      });
      render();
    };
    window.setLanguage = updateLanguage;

    function render() {
      const t = text[lang()];
      if (!articles) {
        content.className = 'notice';
        content.textContent = t.loading;
        return;
      }
      if (!articles.length) {
        content.className = 'notice';
        content.textContent = t.empty;
        return;
      }
      content.className = 'news-list';
      content.innerHTML = articles.map((article, index) => {
        const isRead = (Number(readReceipts.get(article.id)?.revision) || 0) >= (Number(article.revision) || 1);
        const title = lang() === 'zh' ? article.titleZh : article.titleEn;
        const body = lang() === 'zh' ? article.bodyZh : article.bodyEn;
        const publishedAt = article.publishedAt?.toDate?.();
        const date = publishedAt ? new Intl.DateTimeFormat(lang() === 'zh' ? 'zh-HK' : 'en-GB', { dateStyle:'medium', timeStyle:'short', timeZone:'Asia/Hong_Kong' }).format(publishedAt) : '';
        const seen = revealedIds.has(article.id);
        revealedIds.add(article.id);
        const readButton = activeUser
          ? `<button class="read-btn" data-news-id="${escapeHtml(article.id)}" ${isRead ? 'disabled' : ''}>${isRead ? escapeHtml(t.read) : escapeHtml(t.mark)}</button>`
          : '';
        return `<article class="news-card fade-in${seen ? ' is-visible' : ''}"${seen ? '' : ` style="transition-delay:${Math.min(index, 4) * 0.05}s"`}><div class="news-meta">${escapeHtml(t.date)}${date ? ` · ${escapeHtml(date)}` : ''}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(body)}</p>${readButton}</article>`;
      }).join('');
      content.querySelectorAll('.news-card.fade-in:not(.is-visible)').forEach(card => window.auroraFade?.(card));
      content.querySelectorAll('[data-news-id]').forEach(button => button.addEventListener('click', () => markRead(button.dataset.newsId, button)));
    }

    async function loadNews(user) {
      newsUnsubscribers.forEach(unsubscribe => unsubscribe());
      newsUnsubscribers = [];
      activeUser = user;
      content.className = 'notice';
      content.textContent = text[lang()].loading;
      articles = null;
      readReceipts = new Map();
      newsUnsubscribers = [
        onSnapshot(query(collection(db, 'news'), where('status', '==', 'published'), where('deleted', '==', false)), snapshot => {
          if (activeUser?.uid !== user?.uid) return;
          articles = snapshot.docs.map(item => ({ id:item.id, ...item.data() }))
            .sort((a,b) => millis(b.updatedAt) - millis(a.updatedAt));
          render();
        }, error => showLoadError(error))
      ];
      if (user) {
        newsUnsubscribers.push(onSnapshot(query(collection(db, 'newsReads'), where('uid', '==', user.uid)), snapshot => {
          if (activeUser?.uid !== user.uid) return;
          readReceipts = new Map(snapshot.docs.map(item => [item.data().newsId, item.data()]));
          render();
        }, error => showLoadError(error)));
      }
    }

    function showLoadError(error) {
      console.error('Could not load news:', error);
      content.className = 'notice';
      content.textContent = text[lang()].fail;
    }

    async function markRead(newsId, button) {
      if (!activeUser) return;
      button.disabled = true;
      try {
        const receiptId = `${activeUser.uid}_${newsId}`;
        const article = articles.find(item => item.id === newsId);
        await setDoc(doc(db, 'newsReads', receiptId), { uid:activeUser.uid, newsId, revision:Number(article?.revision) || 1, readAt:serverTimestamp() });
        readReceipts.set(newsId, { uid:activeUser.uid, newsId, revision:Number(article?.revision) || 1, readAt:{ toMillis:() => Date.now() } });
        render();
      } catch (error) {
        console.error('Could not mark news as read:', error);
        button.disabled = false;
        button.textContent = text[lang()].markFailed;
      }
    }

    updateLanguage(lang());
    AuroraAuth.onChange(loadNews);
    window.addEventListener('aurora:langchange', event => updateLanguage(event.detail.lang));
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('bg-video');
      let pageRevealed = false;
      const pending = new Set();

      const fadeObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      }, { root: null, rootMargin: '400px 0px 400px 0px', threshold: 0.01 });

      // Used by dynamically rendered content; waits until the page is revealed.
      window.auroraFade = el => { pageRevealed ? fadeObserver.observe(el) : pending.add(el); };

      function revealPage() {
        if (pageRevealed) return;
        pageRevealed = true;
        if (video) video.play().catch(() => {});
        document.body.classList.add('is-loaded');
        document.querySelectorAll('.fade-in:not(.is-visible)').forEach(el => fadeObserver.observe(el));
        pending.forEach(el => fadeObserver.observe(el));
        pending.clear();
      }

      const fontsLoaded = document.fonts ? document.fonts.ready : Promise.resolve();
      const logoLoaded = new Promise(resolve => {
        const img = new Image();
        img.onload = img.onerror = resolve;
        img.src = 'assets/aurora-logo.png';
        if (img.complete) resolve();
      });
      const videoLoaded = new Promise(resolve => {
        if (!video || video.readyState >= 3) return resolve();
        const done = () => resolve();
        video.addEventListener('canplaythrough', done, { once: true });
        video.addEventListener('loadeddata', done, { once: true });
      });
      const fallbackTimer = new Promise(resolve => setTimeout(resolve, 3000));

      Promise.race([Promise.all([fontsLoaded, logoLoaded, videoLoaded]), fallbackTimer]).then(revealPage);
    });
  </script>
</body>
</html>
