<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026-2027 Aurora </title>
<link rel="icon" type="image/jpeg" href="assets/aurora-logo.png">

<script type="module" src="analytics.js"></script>

<!-- Asset Preloading -->
<link rel="preload" href="assets/aurora-logo.png" as="image">
<link rel="preload" href="assets/background.mp4" as="video" type="video/mp4">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --void: #050b12;
    --deep: #0a1a20;
    --ink: #dff6f2;
    --aurora-teal: #2fe6b8;
    --aurora-green: #6ee89a;
    --aurora-cyan: #7fe9f0;
    --aurora-violet: #8f8cf0;
    --star: #ffffff;
    --line: rgba(223, 246, 242, 0.18);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--void);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    overflow-x:hidden;
  }

  /* ---------- Solid Black Preloader Overlay ---------- */
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000000;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  body.is-loaded #preloader {
    opacity: 0;
    visibility: hidden;
  }

  /* ---------- Initial Hidden UI States ---------- */
  .navbar, 
  .wrap, 
  footer,
  .lang-toggle .lang-icon {
    font-size: 1rem; 
    line-height: 1;
  }

  /* Reveal sequence after preloader fades / on language switch */
  body.is-loaded .navbar,
  body.is-loaded .wrap,
  body.is-loaded footer,
  body.is-loaded .lang-toggle {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Entrance Staggering */
  body.is-loaded .navbar { transition-delay: 0.15s; }
  body.is-loaded .wrap   { transition-delay: 0.35s; }
  body.is-loaded footer,
  body.is-loaded .lang-toggle { transition-delay: 0.55s; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
    .navbar, .wrap, footer, .lang-toggle { transition: none !important; opacity: 1 !important; transform: none !important; }
  }

  /* ---------- Top Navigation Panel ---------- */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 4vw;
    background: rgba(6, 13, 22, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(223, 246, 242, 0.12);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .nav-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(127, 233, 240, 0.4);
    box-shadow: 0 0 12px rgba(46, 230, 184, 0.25);
  }

  .nav-title {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: #eafffb;
    letter-spacing: 0.05em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }

  .nav-btn {
    color: rgba(223, 246, 242, 0.85);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: all 0.3s ease;
    cursor: pointer;
    background: transparent;
  }

  .nav-btn:hover,
  .nav-btn.active {
    color: #ffffff;
    border-color: rgba(127, 233, 240, 0.4);
    background: rgba(127, 233, 240, 0.1);
    box-shadow: 0 0 12px rgba(127, 233, 240, 0.2);
    transform: translateY(-1px);
  }

  /* ---------- Hamburger Button ---------- */
  .hamburger-btn {
    display: none;
    background: transparent;
    border: none;
    cursor: pointer;
    flex-direction: column;
    justify-content: space-between;
    width: 24px;
    height: 18px;
    padding: 0;
    z-index: 102;
  }

  .hamburger-btn span {
    display: block;
    width: 100%;
    height: 2px;
    background-color: var(--ink);
    border-radius: 2px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  }

  .hamburger-btn.open span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
  }

  .hamburger-btn.open span:nth-child(2) {
    opacity: 0;
  }

  .hamburger-btn.open span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
  }

  /* ---------- Mobile Navigation Overlay ---------- */
  .nav-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 11, 18, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 98;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }

  .nav-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  /* ---------- Floating Bottom-Right Language Button ---------- */
  .lang-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(127, 233, 240, 0.35);
    background: rgba(10, 26, 32, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #eafffb;
    font-family: 'Manrope', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    transition: border-color 0.35s ease, background 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }

  .lang-toggle:hover {
    border-color: rgba(127, 233, 240, 0.8);
    background: rgba(18, 42, 50, 0.85);
    box-shadow: 0 0 16px rgba(46, 230, 184, 0.3);
    transform: translateY(-2px);
  }

  .lang-toggle svg {
    width: 16px;
    height: 16px;
    stroke: rgba(223, 246, 242, 0.85);
  }

  /* ---------- Video Background ---------- */
  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background: var(--void);
    transform: translateZ(0);
  }

  .bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%) translateZ(0);
    will-change: transform;
    object-fit: cover;
    filter: brightness(1);
    backface-visibility: hidden;
  }

  .sky-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(5, 11, 18, 0.2) 0%, rgba(5, 11, 18, 0.6) 100%),
                linear-gradient(180deg, rgba(5, 11, 18, 0.3) 0%, rgba(5, 11, 18, 0.7) 100%);
    pointer-events: none;
  }

  /* ---------- Content ---------- */
  .wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:14vh 6vw 10vh;
  }

  .council{
    font-family:'Manrope', sans-serif;
    font-weight:400;
    font-size:clamp(0.72rem, 1.4vw, 0.95rem);
    letter-spacing:0.14em;
    color:rgba(223,246,242,0.72);
    line-height:1.9;
  }

  .logo{
    position:relative;
    margin:3.2vh 0 2.2vh;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:clamp(4rem, 15vw, 9.5rem);
    letter-spacing:0.02em;
    line-height:1;
    color:#eafffb;
    text-shadow:
      0 0 18px rgba(127,233,240,0.55),
      0 0 46px rgba(46,230,184,0.4),
      0 0 90px rgba(46,230,184,0.22);
  }
  .logo .accent{
    position:relative;
  }
  .logo .accent::after{
    content:'✦';
    position:absolute;
    left:50%;
    top:-0.62em;
    transform:translateX(-50%);
    font-size:0.26em;
    color:#eafffb;
    text-shadow:0 0 10px rgba(127,233,240,0.9);
  }

  .quote{
    max-width:620px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.15rem, 2.6vw, 1.55rem);
    letter-spacing:0.01em;
    color:#cdeee8;
    line-height:1.7;
    margin:1.6vh 0 4vh;
  }
  .quote span.stars{
    opacity:0.75;
    font-style:normal;
    letter-spacing:0.2em;
  }

  .divider{
    width:1px;
    height:44px;
    background:linear-gradient(180deg, transparent, var(--line), transparent);
    margin:0 0 4vh;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:14px 30px;
    border-radius:999px;
    border:1px solid rgba(223,246,242,0.35);
    background:rgba(10,26,32,0.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:#eafffb;
    text-decoration:none;
    font-size:0.98rem;
    letter-spacing:0.04em;
    transition:border-color 0.35s ease, background 0.35s ease, transform 0.35s ease;
  }
  .cta:hover{
    border-color:rgba(127,233,240,0.75);
    background:rgba(18,42,50,0.7);
    transform:translateY(-2px);
  }
  .cta svg{ width:20px; height:20px; flex-shrink:0; }
  .cta .handle{ color:rgba(223,246,242,0.7); font-size:0.88rem; }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:0 6vw 5vh;
    font-size:0.78rem;
    letter-spacing:0.06em;
    color:rgba(223,246,242,0.4);
  }

  /* ---------- Mobile Drawer Media Query ---------- */
  @media (max-width: 768px) {
    .hamburger-btn {
      display: flex;
    }

    .navbar {
      justify-content: flex-start;
      gap: 16px;
      padding: 0.8rem 1rem;
    }

    .nav-title {
      display: inline-block;
    }

    .nav-links {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      height: 100dvh;
      background: rgba(10, 26, 32, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(127, 233, 240, 0.25);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      flex-direction: column;
      align-items: flex-start;
      padding: 80px 20px 24px;
      gap: 0.8rem;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
    }

    .nav-links.active {
      transform: translateX(0);
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 10px 16px;
      font-size: 0.95rem;
    }

    .lang-toggle {
      bottom: 16px;
      right: 16px;
      padding: 8px 14px;
      font-size: 0.8rem;
    }
  }

  @media (max-width: 520px) {
    .logo { font-size: clamp(3.2rem, 20vw, 5.5rem); }
    .council {
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    }
  }
</style>
</head>
<body>

  <!-- Black Preloader Overlay -->
  <div id="preloader"></div>

  <!-- Floating Bottom-Right Language Toggle Button -->
  <button id="lang-btn" class="lang-toggle" aria-label="Toggle Language">
    <span class="lang-icon">🌐</span>
    <span id="lang-text">繁體中文</span>
  </button>

  <!-- Dynamic Navigation Panel Mount Point -->
  <div id="panel-container"></div>

  <!-- Video Background -->
  <div class="sky">
    <video id="bg-video" class="bg-video" autoplay loop muted playsinline preload="auto">
      <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="sky-overlay"></div>
  </div>

  <main class="wrap">
    <p class="council i18n" data-en="We are" data-zh="我們是">We are</p>

    <h1 class="logo"><span class="accent">A</span>urora</h1>

    <p class="quote">
      <span class="i18n" data-en="Sparked by Aurora, united with Harmonia" data-zh="Sparked by Aurora, united with Harmonia">Sparked by Aurora, united with Harmonia</span><br>
      <span class="stars">⋆ ✧ ˖ °</span>
    </p>

    <div class="divider"></div>

    <a class="cta" href="https://www.instagram.com/gteyc_aurora2627/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="4.3" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="17.4" cy="6.6" r="1.05" fill="currentColor"/>
      </svg>
      <span class="handle">@gteyc_aurora2627</span>
    </a>
  </main>

  <footer class="i18n" data-en="G.T. (Ellen Yeung) College - 2026–27 Candidate Cabinet No. 1" data-zh="優才（楊殷有娣）書院  -  2026–27 1 號候選內閣">G.T. (Ellen Yeung) College - 2026–27 Candidate Cabinet No. 1</footer>

  <script>
    // Language Preference Setup
    let currentLang = localStorage.getItem('aurora_lang') || 'en';
    let isSwitching = false;

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('aurora_lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';

      document.querySelectorAll('.i18n').forEach(el => {
        const text = el.getAttribute(`data-${lang}`);
        if (text) el.innerHTML = text;
      });

      const langText = document.getElementById('lang-text');
      if (langText) {
        langText.textContent = lang === 'en' ? '繁體中文' : 'English';
      }
    }

    setLanguage(currentLang);

    const langBtn = document.getElementById('lang-btn');
    if (langBtn) {
      langBtn.addEventListener('click', () => {
        if (isSwitching) return;
        isSwitching = true;

        document.body.classList.remove('is-loaded');

        setTimeout(() => {
          setLanguage(currentLang === 'en' ? 'zh' : 'en');

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              document.body.classList.add('is-loaded');
              setTimeout(() => { isSwitching = false; }, 1200);
            });
          });
        }, 350);
      });
    }

    // Page Load & Video Auto-Recovery Setup
    let pageRevealed = false;
    function revealPage() {
      if (pageRevealed) return;
      pageRevealed = true;
      const video = document.getElementById('bg-video');
      if (video) video.play().catch(() => {});
      document.body.classList.add('is-loaded');
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(revealPage, 300);

      const video = document.getElementById('bg-video');
      if (video) {
        ['stalled', 'suspend', 'pause', 'waiting'].forEach(evt => {
          video.addEventListener(evt, () => {
            if (video.paused) {
              video.play().catch(() => {});
            }
          });
        });

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && video.paused) {
            video.play().catch(() => {});
          }
        });
      }
    });

    window.addEventListener('load', () => {
      revealPage();
    });
  </script>

  <!-- Load Navigation Panel Component -->
  <script src="load-components.js"></script>
</body>
</html>
