<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora - Support Us</title>
<link rel="icon" type="image/jpeg" href="assets/aurora-logo.png">

<script type="module" src="js/analytics.js"></script>

<!-- Asset & Component Preloading --> 
<link rel="preload" href="panel.html" as="fetch" crossorigin>
<link rel="preload" href="assets/aurora-logo.png" as="image">
<link rel="preload" href="https://res.cloudinary.com/dl2xijhcd/video/upload/f_auto,q_auto,w_1280/v1790563703/background.mp4" as="video" type="video/mp4" crossorigin>

<script type="module" src="js/load-components.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #050b12;
    --deep: #0a1a20;
    --ink: #dff6f2;
    --aurora-teal: #2fe6b8;
    --aurora-green: #6ee89a;
    --aurora-cyan: #7fe9f0;
    --aurora-violet: #8f8cf0;
    --star: #ffffff;
    --line: rgba(223, 246, 242, 0.18);
    --glass-bg: rgba(10, 26, 32, 0.55);
    --glass-border: rgba(127, 233, 240, 0.2);
    --support-blue: #6ec3ff;
    --support-blue-soft: rgba(110, 195, 255, 0.18);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    min-height:100%;
    background:var(--void);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    overflow-x:hidden;
  }

  /* ---------- Solid Black Preloader Overlay ---------- */
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000000;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  body.is-loaded #preloader {
    opacity: 0;
    visibility: hidden;
  }

  /* ---------- Initial Hidden UI States ---------- */
  .navbar, 
  .header-section,
  .section-block,
  footer,
  .lang-toggle {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.35s ease-in, transform 0.35s ease-in;
    pointer-events: none;
  }

  /* Reveal sequence after preloader fades */
  body.is-loaded .navbar,
  body.is-loaded .header-section,
  body.is-loaded footer,
  body.is-loaded .lang-toggle {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  body.is-loaded .navbar { transition-delay: 0.15s; }
  body.is-loaded .header-section { transition-delay: 0.35s; }
  body.is-loaded footer,
  body.is-loaded .lang-toggle { transition-delay: 0.55s; }

  /* ---------- Fade-in Scroll Reveal Effect ---------- */
  .fade-in {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }

  .fade-in.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Optimized Stagger Delays */
  .card-grid .glass-card:nth-child(1) { transition-delay: 0.05s; }
  .card-grid .glass-card:nth-child(2) { transition-delay: 0.10s; }
  .card-grid .glass-card:nth-child(3) { transition-delay: 0.15s; }
  .card-grid .glass-card:nth-child(4) { transition-delay: 0.20s; }
  .card-grid .glass-card:nth-child(n+5) { transition-delay: 0.25s; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
    .navbar, .header-section, .section-block, .fade-in, footer, .lang-toggle { 
      transition: none !important; 
      opacity: 1 !important; 
      transform: none !important; 
    }
  }

  /* ---------- Top Navigation Panel ---------- */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 4vw;
    background: rgba(6, 13, 22, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(223, 246, 242, 0.12);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .nav-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(127, 233, 240, 0.4);
    box-shadow: 0 0 12px rgba(46, 230, 184, 0.25);
  }

  .nav-title {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: #eafffb;
    letter-spacing: 0.05em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .nav-btn {
    color: rgba(223, 246, 242, 0.85);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }

  .nav-btn:hover, .nav-btn.active {
    color: #ffffff;
    border-color: rgba(127, 233, 240, 0.4);
    background: rgba(127, 233, 240, 0.1);
    box-shadow: 0 0 12px rgba(127, 233, 240, 0.2);
  }

  /* ---------- Hamburger Button ---------- */
  .hamburger-btn {
    display: none;
    background: transparent;
    border: none;
    cursor: pointer;
    flex-direction: column;
    justify-content: space-between;
    width: 24px;
    height: 18px;
    padding: 0;
    z-index: 102;
  }

  .hamburger-btn span {
    display: block;
    width: 100%;
    height: 2px;
    background-color: var(--ink);
    border-radius: 2px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  }

  .hamburger-btn.open span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
  }

  .hamburger-btn.open span:nth-child(2) {
    opacity: 0;
  }

  .hamburger-btn.open span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
  }

  /* ---------- Mobile Navigation Overlay ---------- */
  .nav-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 11, 18, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 98;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }

  .nav-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  /* ---------- Floating Bottom-Right Language Button ---------- */
  .lang-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(127, 233, 240, 0.35);
    background: rgba(10, 26, 32, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #eafffb;
    font-family: 'Manrope', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    transition: border-color 0.35s ease, background 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }

  .lang-toggle:hover {
    border-color: rgba(127, 233, 240, 0.8);
    background: rgba(18, 42, 50, 0.85);
    box-shadow: 0 0 16px rgba(46, 230, 184, 0.3);
    transform: translateY(-2px);
  }

  .lang-toggle svg {
    width: 16px;
    height: 16px;
    stroke: rgba(223, 246, 242, 0.85);
  }

  /* ---------- Video Background ---------- */
  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background: var(--void);
  }

  .bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    filter: brightness(1);
  }

  .sky-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(5, 11, 18, 0.2) 0%, rgba(5, 11, 18, 0.6) 100%),
                linear-gradient(180deg, rgba(5, 11, 18, 0.3) 0%, rgba(5, 11, 18, 0.7) 100%);
    pointer-events: none;
  }

  /* ---------- Layout & Content ---------- */
  .page-container {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 140px 6vw 80px;
  }

  .header-section {
    text-align: center;
    margin-bottom: 60px;
  }

  .page-subtitle {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--aurora-cyan);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .page-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    color: #ffffff;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(127, 233, 240, 0.3);
  }

  .page-description {
    max-width: 680px;
    margin: 0 auto;
    font-size: 1.05rem;
    line-height: 1.8;
    color: rgba(223, 246, 242, 0.8);
  }

  .section-block {
    margin-bottom: 70px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 6vw 40px;
    font-size: 0.78rem;
    color: rgba(223, 246, 242, 0.4);
  }

  /* ---------- Support Us Page ---------- */
  .support-hero {
    text-align: center;
  }

  .support-count-label {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--support-blue);
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .support-count {
    font-family: 'Cinzel', serif;
    font-size: clamp(3.6rem, 13vw, 7.5rem);
    font-weight: 700;
    color: #ffffff;
    line-height: 1.05;
    text-shadow: 0 0 30px rgba(110, 195, 255, 0.55), 0 0 60px rgba(110, 195, 255, 0.25);
    transition: text-shadow 0.3s ease;
  }

  .support-count.bump {
    animation: supportCountBump 0.5s ease;
  }

  @keyframes supportCountBump {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); text-shadow: 0 0 45px rgba(110, 195, 255, 0.85), 0 0 90px rgba(110, 195, 255, 0.4); }
    100% { transform: scale(1); }
  }

  .support-action {
    margin-top: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .support-btn {
    font-family: 'Manrope', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: #04121c;
    background: linear-gradient(135deg, #8fd6ff, var(--support-blue));
    border: 1px solid rgba(110, 195, 255, 0.7);
    padding: 20px 52px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.02em;
    box-shadow: 0 0 25px rgba(110, 195, 255, 0.45);
    transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
  }

  .support-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 0 40px rgba(110, 195, 255, 0.7);
  }

  .support-btn:active:not(:disabled) {
    transform: translateY(-1px);
  }

  .support-btn:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    background: linear-gradient(135deg, rgba(143, 214, 255, 0.4), rgba(110, 195, 255, 0.4));
    box-shadow: none;
  }

  .support-status {
    font-size: 0.95rem;
    color: rgba(223, 246, 242, 0.75);
    min-height: 1.4em;
    text-align: center;
  }

  /* ---------- Bottom-Left Device / Click Info Bar ---------- */
  .support-info-bar {
    position: fixed;
    bottom: 26px;
    left: 76px; /* leaves room for the shared info button */
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(110, 195, 255, 0.35);
    background: rgba(10, 26, 32, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(223, 246, 242, 0.85);
    font-family: 'Manrope', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .support-info-bar .dot {
    color: rgba(223, 246, 242, 0.35);
  }

  .support-info-bar strong {
    color: var(--support-blue);
    font-weight: 700;
  }

  .support-info-bar code {
    font-family: 'Manrope', sans-serif;
    color: rgba(223, 246, 242, 0.75);
    letter-spacing: 0.03em;
  }

  @media (max-width: 640px) {
    .support-info-bar {
      left: 62px;
      bottom: 16px;
      right: 12px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.7rem;
      text-align: center;
    }

    .lang-toggle {
      bottom: 70px;
    }
  }

  @media (max-width: 768px) {
    .hamburger-btn { display: flex; }
    .navbar { justify-content: flex-start; gap: 16px; padding: 0.8rem 1rem; }
    .nav-title { display: inline-block; }
    .nav-links {
      position: fixed; top: 0; left: 0; width: 260px; height: 100vh; height: 100dvh;
      background: rgba(10, 26, 32, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(127, 233, 240, 0.25); box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      flex-direction: column; align-items: flex-start; padding: 80px 20px 24px; gap: 0.8rem;
      transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); z-index: 99;
    }
    .nav-links.active { transform: translateX(0); }
    .nav-btn { width: 100%; text-align: left; padding: 10px 16px; font-size: 0.95rem; }
    .lang-toggle { bottom: 16px; right: 16px; padding: 8px 14px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

  <!-- Black Preloader Overlay -->
  <div id="preloader"></div>


  <!-- Dynamic Navigation Panel Mount Point -->
  <div id="panel-container"></div>

  <!-- Video Background -->
  <div id="background-container"></div>

  <main class="page-container">
    <div class="header-section">
      <h1 class="page-title i18n" data-en="Support Us" data-zh="支持我們">Support Us</h1>
      <p class="page-description i18n" data-en="Every tap below is a small vote of confidence for us! Press the counter to support us! The counter is updated in real life." data-zh="每一次點擊都是對候選內閣 Aurora 的一份支持。每 10 分鐘可以支持一次，一起點亮以下的支持人數吧！">
        Every tap below is a small vote of confidence for us! Press the counter to support us! The counter is updated in real life.
      </p>
    </div>

    <!-- PART 1: Support Counter + Button -->
    <div class="section-block fade-in support-hero">
      <div class="support-count-label i18n" data-en="Total Supporters" data-zh="總支持人次">Total Supporters</div>
      <div class="support-count" id="support-count">0</div>

      <div class="support-action">
        <button id="support-btn" class="support-btn" disabled>Checking your status...</button>
        <p class="support-status" id="support-status"></p>
      </div>
    </div>
  </main>

  <!-- Bottom-Left Local Support-Click Counter -->
  <div class="support-info-bar">
    <span class="i18n" data-en="Your supports:" data-zh="你的支持次數：">Your supports:</span>
    <strong id="bar-clicks">0</strong>
  </div>

  <footer class="i18n" data-en="G.T. (Ellen Yeung) College - 2026–27 Candidate Cabinet No. 1" data-zh="優才（楊殷有娣）書院  -  2026–27 1 號候選內閣">G.T. (Ellen Yeung) College - 2026–27 Candidate Cabinet No. 1</footer>

  <script type="module">
    import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { db, auth } from './firebase-config.js';
    import { API_BASE } from './api-config.js';

    const COOLDOWN_MS = 10 * 60 * 1000;

    const btn = document.getElementById('support-btn');
    const statusEl = document.getElementById('support-status');
    const countEl = document.getElementById('support-count');
    const barClicksEl = document.getElementById('bar-clicks');

    let countdownTimer = null;

    const btnLabels = {
      en: { ready: 'Support Us 💙', offline: 'Unavailable' },
      zh: { ready: '支持我們 💙', offline: '暫時無法使用' }
    };
    const msgs = {
      en: {
        already: "You've already supported recently.", thanks: 'Thank you for your support! 💙',
        error: 'Something went wrong - please try again.', offline: 'Could not reach the server - please try again later.'
      },
      zh: {
        already: '你最近已經支持過了。', thanks: '感謝你的支持！💙',
        error: '發生錯誤，請再試一次。', offline: '無法連線至伺服器，請稍後再試。'
      }
    };
    const lang = () => (localStorage.getItem('aurora_lang') || 'en') === 'zh' ? 'zh' : 'en';

    const LOCAL_KEY = 'aurora_local_support_clicks';
    const getLocalClickCount = () => parseInt(localStorage.getItem(LOCAL_KEY) || '0', 10);
    function bumpLocalClickCount() { localStorage.setItem(LOCAL_KEY, String(getLocalClickCount() + 1)); }
    function updateBottomBar() { if (barClicksEl) barClicksEl.textContent = getLocalClickCount(); }

    function formatMMSS(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      return `${Math.floor(totalSec / 60)}:${(totalSec % 60).toString().padStart(2, '0')}`;
    }

    function setReady() {
      clearInterval(countdownTimer);
      btn.disabled = false;
      btn.textContent = btnLabels[lang()].ready;
      statusEl.textContent = '';
    }

    function startCountdown(remainingMs) {
      clearInterval(countdownTimer);
      const endsAt = Date.now() + remainingMs;
      btn.disabled = true;

      const tick = () => {
        const left = endsAt - Date.now();
        if (left <= 0) return setReady();
        btn.textContent = formatMMSS(left);
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    // ---------- Device identity ----------
    // A random id kept in localStorage AND a long-lived cookie, so clearing
    // just one of them doesn't hand out a fresh cooldown. The server only
    // stores a keyed hash of it.
    const DEVICE_KEY = 'aurora_device_id';
    function readCookie(name) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function getDeviceId() {
      const valid = (v) => typeof v === 'string' && /^[A-Za-z0-9_-]{16,64}$/.test(v);
      let id = null;
      try { id = localStorage.getItem(DEVICE_KEY); } catch {}
      if (!valid(id)) id = readCookie(DEVICE_KEY);
      if (!valid(id)) id = crypto.randomUUID();
      try { localStorage.setItem(DEVICE_KEY, id); } catch {}
      document.cookie = `${DEVICE_KEY}=${encodeURIComponent(id)}; max-age=${60 * 60 * 24 * 365 * 2}; path=/; SameSite=Lax`;
      return id;
    }
    const deviceId = getDeviceId();

    const API_URL = `${API_BASE}/api/support?device=${encodeURIComponent(deviceId)}`;

    async function callSupport(method) {
      // If signed in, send the ID token so the cooldown also applies to the account.
      const headers = {};
      if (auth.currentUser) {
        try { headers.Authorization = `Bearer ${await auth.currentUser.getIdToken()}`; } catch {}
      }
      const res = await fetch(API_URL, { method, headers });
      const contentType = res.headers.get('content-type') || '';
      let data = {};

      if (contentType.includes('application/json')) {
        data = await res.json().catch(() => ({}));
      } else {
        const text = await res.text().catch(() => '');
        console.warn('Received non-JSON response from API:', text);
      }
      return { status: res.status, data };
    }

    async function refreshStatus() {
      try {
        const { status, data } = await callSupport('GET');
        if (status === 200 && data.ok) {
          if (data.remainingMs > 0) startCountdown(data.remainingMs); else setReady();
        } else {
          throw new Error(data.error || `Status ${status}`);
        }
      } catch (err) {
        console.error('Support status check failed:', err);
        btn.textContent = btnLabels[lang()].offline;
        statusEl.textContent = msgs[lang()].offline;
      }
    }

    function init() {
      onSnapshot(doc(db, "counters", "supportCounter"), (snap) => {
        if (snap.exists()) countEl.textContent = (snap.data().count || 0).toLocaleString();
      });
      updateBottomBar();

      // Fires once when Firebase has restored the session (user or null), and
      // again on every sign-in / sign-out, so the cooldown shown always
      // reflects the current account + this device.
      onAuthStateChanged(auth, () => refreshStatus());
    }

    btn.addEventListener('click', async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const { status, data } = await callSupport('POST');
        if (status === 200 && data.ok) {
          bumpLocalClickCount();
          updateBottomBar();
          statusEl.textContent = msgs[lang()].thanks;
          startCountdown(data.remainingMs || COOLDOWN_MS);
        } else if (status === 429 || (data && !data.ok && data.remainingMs > 0)) {
          statusEl.textContent = msgs[lang()].already;
          startCountdown(data.remainingMs || COOLDOWN_MS);
        } else {
          throw new Error(data.error || `Status ${status}`);
        }
      } catch (err) {
        console.error('Support click failed:', err);
        setReady();
        statusEl.textContent = msgs[lang()].error;
      }
    });

    init();
  </script>

  <script>
    let currentLang = localStorage.getItem('aurora_lang') || 'en';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('aurora_lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';

      document.querySelectorAll('.i18n').forEach(el => {
        const text = el.getAttribute(`data-${lang}`);
        if (text) el.innerHTML = text;
      });

      const langText = document.getElementById('lang-text');
      if (langText) {
        langText.textContent = lang === 'en' ? '繁體中文' : 'English';
      }
    }

    setLanguage(currentLang);

    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('bg-video');
      let pageRevealed = false;

      const observerOptions = {
        root: null,
        rootMargin: '400px 0px 400px 0px',
        threshold: 0.01
      };

      const fadeObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      }, observerOptions);

      function revealPage() {
        if (pageRevealed) return;
        pageRevealed = true;

        if (video) {
          video.play().catch(() => {});
        }

        document.body.classList.add('is-loaded');
        document.querySelectorAll('.fade-in').forEach(el => fadeObserver.observe(el));
      }

      const fontsLoaded = document.fonts ? document.fonts.ready : Promise.resolve();

      const logoImage = new Image();
      logoImage.src = 'assets/aurora-logo.png';
      const logoLoaded = new Promise((resolve) => {
        if (logoImage.complete) resolve();
        else {
          logoImage.onload = resolve;
          logoImage.onerror = resolve;
        }
      });

      const videoLoaded = new Promise((resolve) => {
        if (!video) return resolve();
        if (video.readyState >= 3) {
          resolve();
        } else {
          const onCanPlay = () => {
            video.removeEventListener('canplaythrough', onCanPlay);
            video.removeEventListener('loadeddata', onCanPlay);
            resolve();
          };
          video.addEventListener('canplaythrough', onCanPlay);
          video.addEventListener('loadeddata', onCanPlay);
        }
      });

      const fallbackTimer = new Promise((resolve) => setTimeout(resolve, 3000));

      Promise.race([
        Promise.all([fontsLoaded, logoLoaded, videoLoaded]),
        fallbackTimer
      ]).then(() => {
        revealPage();
      });
    });
  </script>
</body>
</html>
