<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora - Support Us</title>
<link rel="icon" type="image/jpeg" href="assets/aurora-logo.png">

<!-- Asset Preloading --> 
<link rel="preload" href="assets/aurora-logo.png" as="image">
<link rel="preload" href="assets/background.mp4" as="video" type="video/mp4">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #050b12;
    --deep: #0a1a20;
    --ink: #dff6f2;
    --aurora-teal: #2fe6b8;
    --aurora-green: #6ee89a;
    --aurora-cyan: #7fe9f0;
    --aurora-violet: #8f8cf0;
    --star: #ffffff;
    --line: rgba(223, 246, 242, 0.18);
    --glass-bg: rgba(10, 26, 32, 0.55);
    --glass-border: rgba(127, 233, 240, 0.2);
    --support-blue: #6ec3ff;
    --support-blue-soft: rgba(110, 195, 255, 0.18);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    min-height:100%;
    background:var(--void);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    overflow-x:hidden;
  }

  /* ---------- Solid Black Preloader Overlay ---------- */
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000000;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  body.is-loaded #preloader {
    opacity: 0;
    visibility: hidden;
  }

  /* ---------- Initial Hidden UI States ---------- */
  .navbar, 
  .header-section,
  .section-block,
  footer,
  .lang-toggle {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.35s ease-in, transform 0.35s ease-in;
    pointer-events: none;
  }

  /* Reveal sequence after preloader fades */
  body.is-loaded .navbar,
  body.is-loaded .header-section,
  body.is-loaded footer,
  body.is-loaded .lang-toggle {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  body.is-loaded .navbar { transition-delay: 0.15s; }
  body.is-loaded .header-section { transition-delay: 0.35s; }
  body.is-loaded footer,
  body.is-loaded .lang-toggle { transition-delay: 0.55s; }

  /* ---------- Fade-in Scroll Reveal Effect ---------- */
  .fade-in {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }

  .fade-in.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Optimized Stagger Delays */
  .card-grid .glass-card:nth-child(1) { transition-delay: 0.05s; }
  .card-grid .glass-card:nth-child(2) { transition-delay: 0.10s; }
  .card-grid .glass-card:nth-child(3) { transition-delay: 0.15s; }
  .card-grid .glass-card:nth-child(4) { transition-delay: 0.20s; }
  .card-grid .glass-card:nth-child(n+5) { transition-delay: 0.25s; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
    .navbar, .header-section, .section-block, .fade-in, footer, .lang-toggle { 
      transition: none !important; 
      opacity: 1 !important; 
      transform: none !important; 
    }
  }

  /* ---------- Top Navigation Panel ---------- */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 4vw;
    background: rgba(6, 13, 22, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(223, 246, 242, 0.12);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .nav-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(127, 233, 240, 0.4);
    box-shadow: 0 0 12px rgba(46, 230, 184, 0.25);
  }

  .nav-title {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: #eafffb;
    letter-spacing: 0.05em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .nav-btn {
    color: rgba(223, 246, 242, 0.85);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }

  .nav-btn:hover, .nav-btn.active {
    color: #ffffff;
    border-color: rgba(127, 233, 240, 0.4);
    background: rgba(127, 233, 240, 0.1);
    box-shadow: 0 0 12px rgba(127, 233, 240, 0.2);
  }

  /* ---------- Hamburger Button ---------- */
  .hamburger-btn {
    display: none;
    background: transparent;
    border: none;
    cursor: pointer;
    flex-direction: column;
    justify-content: space-between;
    width: 24px;
    height: 18px;
    padding: 0;
    z-index: 102;
  }

  .hamburger-btn span {
    display: block;
    width: 100%;
    height: 2px;
    background-color: var(--ink);
    border-radius: 2px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
  }

  .hamburger-btn.open span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
  }

  .hamburger-btn.open span:nth-child(2) {
    opacity: 0;
  }

  .hamburger-btn.open span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
  }

  /* ---------- Mobile Navigation Overlay ---------- */
  .nav-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 11, 18, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 98;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }

  .nav-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  /* ---------- Floating Bottom-Right Language Button ---------- */
  .lang-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(127, 233, 240, 0.35);
    background: rgba(10, 26, 32, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #eafffb;
    font-family: 'Manrope', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    transition: border-color 0.35s ease, background 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }

  .lang-toggle:hover {
    border-color: rgba(127, 233, 240, 0.8);
    background: rgba(18, 42, 50, 0.85);
    box-shadow: 0 0 16px rgba(46, 230, 184, 0.3);
    transform: translateY(-2px);
  }

  .lang-toggle svg {
    width: 16px;
    height: 16px;
    stroke: rgba(223, 246, 242, 0.85);
  }

  /* ---------- Video Background ---------- */
  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background: var(--void);
  }

  .bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    filter: brightness(1);
  }

  .sky-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(5, 11, 18, 0.2) 0%, rgba(5, 11, 18, 0.6) 100%),
                linear-gradient(180deg, rgba(5, 11, 18, 0.3) 0%, rgba(5, 11, 18, 0.7) 100%);
    pointer-events: none;
  }

  /* ---------- Layout & Content ---------- */
  .page-container {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 140px 6vw 80px;
  }

  .header-section {
    text-align: center;
    margin-bottom: 60px;
  }

  .page-subtitle {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--aurora-cyan);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .page-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    color: #ffffff;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(127, 233, 240, 0.3);
  }

  .page-description {
    max-width: 680px;
    margin: 0 auto;
    font-size: 1.05rem;
    line-height: 1.8;
    color: rgba(223, 246, 242, 0.8);
  }

  .section-block {
    margin-bottom: 70px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 6vw 40px;
    font-size: 0.78rem;
    color: rgba(223, 246, 242, 0.4);
  }

  /* ---------- Support Us Page ---------- */
  .support-hero {
    text-align: center;
  }

  .support-count-label {
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--support-blue);
    text-transform: uppercase;
    margin-bottom: 28px;

  .support-count {
    font-family: 'Cinzel', serif;
    font-size: clamp(3.6rem, 13vw, 7.5rem);
    font-weight: 700;

    text-shadow: 0 0 30px rgba(110, 195, 255, 0.55), 0 0 60px rgba(110, 195, 255, 0.25);
    transition: text-shadow 0.3s ease;
  }

  .support-count.bump {
    animation: supportCountBump 0.5s ease;
  }

  @keyframes supportCountBump {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); text-shadow: 0 0 45px rgba(110, 195, 255, 0.85), 0 0 90px rgba(110, 195, 255, 0.4); }
    100% { transform: scale(1); }
  }

  .support-action {
    margin-top: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .support-btn {
    font-family: 'Manrope', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: #04121c;
    background: linear-gradient(135deg, #8fd6ff, var(--support-blue));
    border: 1px solid rgba(110, 195, 255, 0.7);
    padding: 20px 52px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.02em;
    box-shadow: 0 0 25px rgba(110, 195, 255, 0.45);
    transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
  }

  .support-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 0 40px rgba(110, 195, 255, 0.7);
  }

  .support-btn:active:not(:disabled) {
    transform: translateY(-1px);
  }

  .support-btn:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    background: linear-gradient(135deg, rgba(143, 214, 255, 0.4), rgba(110, 195, 255, 0.4));
    box-shadow: none;
  }

  .support-status {
    font-size: 0.95rem;
    color: rgba(223, 246, 242, 0.75);
    min-height: 1.4em;
    text-align: center;
  }

  /* ---------- Bottom-Left Device / Click Info Bar ---------- */
  .support-info-bar {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(110, 195, 255, 0.35);
    background: rgba(10, 26, 32, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(223, 246, 242, 0.85);
    font-family: 'Manrope', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .support-info-bar .dot {
    color: rgba(223, 246, 242, 0.35);
  }

  .support-info-bar strong {
    color: var(--support-blue);
    font-weight: 700;
  }

  .support-info-bar code {
    font-family: 'Manrope', sans-serif;
    color: rgba(223, 246, 242, 0.75);
    letter-spacing: 0.03em;
  }

  @media (max-width: 640px) {
    .support-info-bar {
      left: 12px;
      bottom: 12px;
      right: 12px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.7rem;
      text-align: center;
    }

    .lang-toggle {
      bottom: 70px;
    }
  }

  @media (max-width: 768px) {
    .hamburger-btn { display: flex; }
    .navbar { justify-content: flex-start; gap: 16px; padding: 0.8rem 1rem; }
    .nav-title { display: inline-block; }
    .nav-links {
      position: fixed; top: 0; left: 0; width: 260px; height: 100vh; height: 100dvh;
      background: rgba(10, 26, 32, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(127, 233, 240, 0.25); box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      flex-direction: column; align-items: flex-start; padding: 80px 20px 24px; gap: 0.8rem;
      transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); z-index: 99;
    }
    .nav-links.active { transform: translateX(0); }
    .nav-btn { width: 100%; text-align: left; padding: 10px 16px; font-size: 0.95rem; }
    .lang-toggle { bottom: 16px; right: 16px; padding: 8px 14px; font-size: 0.8rem; }
  }
</style>

  <script src="load-components.js"></script>

  <!--
    Support Us: vote tracking.

    Everything specific to this page's "support counter" now lives here
    rather than in the shared analytics.js — it isn't general site
    analytics, it's a one-off, rate-limited counter feature.

    Identity/rate-limiting: instead of browser fingerprinting (screen
    size, WebGL renderer, canvas hash, audio fingerprint, installed
    fonts, etc. — which, combined with an IP address, ends up MORE
    identifying than the IP alone, and is not proportionate to collect
    just to gate a support-counter button), this only ever computes a
    salted SHA-256 hash of the visitor's public IP address. That hash is
    the sole thing stored, and it's enough to enforce "once per network
    per cooldown" regardless of browser, profile, or incognito mode,
    since none of those change your IP address.

    Security: the cooldown is enforced by firestore.rules, not just by
    this script — see the comment on the `supporters/{ipHash}` rule.
    That means the button being disabled client-side is just a UX nicety;
    even if someone bypasses it entirely (e.g. by pasting Firestore SDK
    calls into the console), the write will be rejected by Firestore
    unless the cooldown has genuinely elapsed.
  -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Uo9IaoMgXK5Kujj4c4idqUImpz_P5WY",
      authDomain: "gtcsu-aurora.firebaseapp.com",
      projectId: "gtcsu-aurora",
      storageBucket: "gtcsu-aurora.firebasestorage.app",
      messagingSenderId: "961705164297",
      appId: "1:961705164297:web:34331ed1cf626ec4e5c2d8",
      measurementId: "G-ZWE0Z6VTZK"
    };

    const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Must match the `duration.value(10, 'm')` in firestore.rules — this
    // copy only drives the on-page countdown display, the rule is what
    // actually enforces it.
    const COOLDOWN_MS = 10 * 60 * 1000; // 10 minutes

    const btn = document.getElementById('support-btn');
    const statusEl = document.getElementById('support-status');
    const countEl = document.getElementById('support-count');
    const barClicksEl = document.getElementById('bar-clicks');

    let myIpHash = null;
    let countdownTimer = null;

    const btnLabels = {
      en: { ready: 'Support Us 💙', sent: 'Thank you! 💙', checking: 'Checking your status...', offline: 'Unavailable' },
      zh: { ready: '支持我們 💙', sent: '謝謝支持！💙', checking: '正在核實狀態...', offline: '暫時無法使用' }
    };

    // ---------------------------------------------------------------
    // Minimal identity: salted hash of the public IP only.
    // ---------------------------------------------------------------
    async function getPublicIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        if (!res.ok) throw new Error("IP lookup returned " + res.status);
        const data = await res.json();
        return data.ip || null;
      } catch (err) {
        console.error("Support: public IP lookup failed:", err);
        return null;
      }
    }

    async function sha256Hex(str) {
      const msgBuffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function computeIpHash() {
      const ip = await getPublicIP();
      if (!ip) return null;
      const hash = await sha256Hex("aurora_ip_salt_v1:" + ip);
      return "ip_" + hash.substring(0, 24);
    }

    // Purely cosmetic local tally of how many times *this browser* has
    // successfully voted — not used for any security decision.
    function getLocalClickCount() {
      return parseInt(localStorage.getItem('aurora_local_support_clicks') || '0', 10);
    }
    function bumpLocalClickCount() {
      const next = getLocalClickCount() + 1;
      localStorage.setItem('aurora_local_support_clicks', String(next));
      return next;
    }
    function updateBottomBar() {
      if (barClicksEl) {
        barClicksEl.textContent = getLocalClickCount();
      }
    }
    function currentLangCode() {
      return (localStorage.getItem('aurora_lang') || 'en') === 'zh' ? 'zh' : 'en';
    }

    function formatMMSS(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function startCountdown(remainingMs) {
      clearInterval(countdownTimer);
      let remaining = remainingMs;
      btn.disabled = true;

      const tick = () => {
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          btn.disabled = false;
          btn.textContent = btnLabels[currentLangCode()].ready;
          statusEl.textContent = '';
          return;
        }
        btn.textContent = formatMMSS(remaining);
        remaining -= 1000;
      };

      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    // How much cooldown is left, based on the supporter doc's
    // server-set `lastClickAt` timestamp (not any client-supplied value).
    function remainingCooldownMs(data) {
      if (!data || !data.lastClickAt) return 0;
      const lastClickMs = data.lastClickAt.toMillis ? data.lastClickAt.toMillis() : 0;
      return Math.max(0, (lastClickMs + COOLDOWN_MS) - Date.now());
    }

    async function checkAndApplyCooldown() {
      if (!myIpHash) return;

      const snap = await getDoc(doc(db, "supporters", myIpHash));
      const remaining = snap.exists() ? remainingCooldownMs(snap.data()) : 0;

      if (remaining > 0) {
        startCountdown(remaining);
      } else {
        btn.disabled = false;
        btn.textContent = btnLabels[currentLangCode()].ready;
        statusEl.textContent = '';
      }
    }

    async function init() {
      onSnapshot(doc(db, "counters", "supportCounter"), (snap) => {
        if (snap.exists()) {
          countEl.textContent = (snap.data().count || 0).toLocaleString();
        }
      });

      updateBottomBar();

      myIpHash = await computeIpHash();

      if (!myIpHash) {
        btn.textContent = btnLabels[currentLangCode()].offline;
        statusEl.textContent = currentLangCode() === 'zh'
          ? '無法核實你的網絡，請稍後再試。'
          : 'Could not verify your network - please try again later.';
        return;
      }

      await checkAndApplyCooldown();
    }

    btn.addEventListener('click', async () => {
      if (btn.disabled || !myIpHash) return;
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const supporterRef = doc(db, "supporters", myIpHash);
        const snap = await getDoc(supporterRef);

        if (snap.exists()) {
          const data = snap.data();
          const remaining = remainingCooldownMs(data);

          if (remaining > 0) {
            statusEl.textContent = currentLangCode() === 'zh' ? '你最近已經支持過了。' : "You've already supported recently.";
            startCountdown(remaining);
            return;
          }

          // Server-enforced: Firestore rejects this write unless the
          // cooldown has genuinely elapsed, regardless of what the
          // client believes.
          await updateDoc(supporterRef, {
            clicks: (data.clicks || 0) + 1,
            lastClickAt: serverTimestamp()
          });
        } else {
          await setDoc(supporterRef, {
            clicks: 1,
            lastClickAt: serverTimestamp()
          });
        }

        const counterRef = doc(db, "counters", "supportCounter");
        const counterSnap = await getDoc(counterRef);
        if (counterSnap.exists()) {
          await updateDoc(counterRef, { count: (counterSnap.data().count || 0) + 1 });
        } else {
          await setDoc(counterRef, { count: 1 });
        }

        bumpLocalClickCount();
        updateBottomBar();

        statusEl.textContent = currentLangCode() === 'zh' ? '感謝你的支持！💙' : 'Thank you for your support! 💙';
        startCountdown(COOLDOWN_MS);

      } catch (err) {
        // A permission-denied error here almost always means
        // firestore.rules rejected the write (e.g. someone tried to
        // skip the cooldown via the console) - that's the rules
        // working as intended, not a bug.
        console.error('Support click failed:', err);
        btn.disabled = false;
        btn.textContent = btnLabels[currentLangCode()].ready;
        statusEl.textContent = currentLangCode() === 'zh' ? '發生錯誤，請再試一次。' : 'Something went wrong - please try again.';
      }
    });

    init();
  </script>

  <script>
    let currentLang = localStorage.getItem('aurora_lang') || 'en';
    let isSwitching = false;

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('aurora_lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';

      document.querySelectorAll('.i18n').forEach(el => {
        const text = el.getAttribute(`data-${lang}`);
        if (text) el.innerHTML = text;
      });

      const langText = document.getElementById('lang-text');
      if (langText) {
        langText.textContent = lang === 'en' ? '繁體中文' : 'English';
      }
    }

    setLanguage(currentLang);

    document.getElementById('lang-btn').addEventListener('click', () => {
      if (isSwitching) return;
      isSwitching = true;

      document.body.classList.remove('is-loaded');

      setTimeout(() => {
        setLanguage(currentLang === 'en' ? 'zh' : 'en');

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.body.classList.add('is-loaded');
            setTimeout(() => { isSwitching = false; }, 1200);
          });
        });
      }, 350);
    });

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const navLinks = document.getElementById('nav-links');
    const navOverlay = document.getElementById('nav-overlay');

    function toggleMobileMenu() {
      if (!hamburgerBtn || !navLinks || !navOverlay) return;
      const isOpen = hamburgerBtn.classList.toggle('open');
      navLinks.classList.toggle('active', isOpen);
      navOverlay.classList.toggle('active', isOpen);
    }

    function closeMobileMenu() {
      if (!hamburgerBtn || !navLinks || !navOverlay) return;
      hamburgerBtn.classList.remove('open');
      navLinks.classList.remove('active');
      navOverlay.classList.remove('active');
    }

    hamburgerBtn?.addEventListener('click', toggleMobileMenu);
    navOverlay?.addEventListener('click', closeMobileMenu);
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', closeMobileMenu);
    });

    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('bg-video');
      let pageRevealed = false;

      const observerOptions = {
        root: null,
        rootMargin: '400px 0px 400px 0px',
        threshold: 0.01
      };

      const fadeObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      }, observerOptions);

      function revealPage() {
        if (pageRevealed) return;
        pageRevealed = true;

        if (video) {
          video.play().catch(() => {});
        }

        document.body.classList.add('is-loaded');
        document.querySelectorAll('.fade-in').forEach(el => fadeObserver.observe(el));
      }

      const fontsLoaded = document.fonts ? document.fonts.ready : Promise.resolve();

      const logoImage = new Image();
      logoImage.src = 'assets/aurora-logo.png';
      const logoLoaded = new Promise((resolve) => {
        if (logoImage.complete) resolve();
        else {
          logoImage.onload = resolve;
          logoImage.onerror = resolve;
        }
      });

      const videoLoaded = new Promise((resolve) => {
        if (!video) return resolve();
        if (video.readyState >= 3) {
          resolve();
        } else {
          const onCanPlay = () => {
            video.removeEventListener('canplaythrough', onCanPlay);
            video.removeEventListener('loadeddata', onCanPlay);
            resolve();
          };
          video.addEventListener('canplaythrough', onCanPlay);
          video.addEventListener('loadeddata', onCanPlay);
        }
      });

      const fallbackTimer = new Promise((resolve) => setTimeout(resolve, 3000));

      Promise.race([
        Promise.all([fontsLoaded, logoLoaded, videoLoaded]),
        fallbackTimer
      ]).then(() => {
        revealPage();
      });
    });
  </script>
</body>
</html>
